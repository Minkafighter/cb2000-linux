name: Release Prebuilt Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (linux-x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          if [[ -z "$TAG" ]]; then
            echo "Error: Release tag could not be determined." >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release -p cb2000-fprintd -p cb2000-cli

      - name: Stage release tarball and checksums
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          STAGE="cb2000-linux-${TAG}-x86_64"
          rm -rf dist
          mkdir -p "dist/${STAGE}/bin"

          cp target/release/cb2000-fprintd "dist/${STAGE}/bin/"
          cp target/release/cb2000-cli "dist/${STAGE}/bin/"
          strip "dist/${STAGE}/bin/cb2000-fprintd" "dist/${STAGE}/bin/cb2000-cli"
          chmod 755 "dist/${STAGE}/bin/cb2000-fprintd" "dist/${STAGE}/bin/cb2000-cli"

          cp -a packaging "dist/${STAGE}/packaging"
          chmod 755 "dist/${STAGE}/packaging/install.sh"
          cp README.md LICENSE "dist/${STAGE}/"

          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          (cd dist && sha256sum "${STAGE}.tar.gz" > SHA256SUMS.txt)

          ls -lh dist/
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          TARBALL="dist/cb2000-linux-${TAG}-x86_64.tar.gz"
          CHECKSUMS="dist/SHA256SUMS.txt"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${TARBALL}" "${CHECKSUMS}" --clobber
          else
            gh release create "${TAG}" "${TARBALL}" "${CHECKSUMS}" \
              --title "cb2000-linux ${TAG}" \
              --target "${GITHUB_SHA}" \
              --generate-notes
          fi
